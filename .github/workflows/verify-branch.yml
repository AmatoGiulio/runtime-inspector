name: Verify branch

on:
  push:
    branches:
      - rozenite-client

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify and capture output
        shell: bash
        run: |
          set +e
          status=0
          : > .verification.log
          echo '=== pnpm build ===' | tee -a .verification.log
          pnpm build 2>&1 | tee -a .verification.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then status=$code; fi
          echo "BUILD_EXIT=$code" | tee -a .verification.log
          echo '=== pnpm typecheck ===' | tee -a .verification.log
          pnpm typecheck 2>&1 | tee -a .verification.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then status=$code; fi
          echo "TYPECHECK_EXIT=$code" | tee -a .verification.log
          echo '=== pnpm test ===' | tee -a .verification.log
          pnpm test 2>&1 | tee -a .verification.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then status=$code; fi
          echo "TEST_EXIT=$code" | tee -a .verification.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .verification.log
          git commit -m "Capture verification output [skip ci]"
          git push
          exit "$status"
