name: Verify branch

on:
  push:
    branches:
      - rozenite-client

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and persist lockfile
        shell: bash
        run: |
          pnpm install --no-frozen-lockfile
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "Update pnpm lockfile [skip ci]"
            git push
          fi
      - name: Verify and capture output
        shell: bash
        run: |
          set +e
          status=0
          : > .verification.txt
          for command in build typecheck test; do
            echo "=== pnpm $command ===" | tee -a .verification.txt
            pnpm "$command" 2>&1 | tee -a .verification.txt
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then status=$code; fi
            echo "${command^^}_EXIT=$code" | tee -a .verification.txt
          done
          echo '=== targeted Rozenite tests ===' | tee -a .verification.txt
          pnpm --filter @runtime-inspector/panel-rozenite test 2>&1 | tee -a .verification.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then status=$code; fi
          echo "ROZENITE_TEST_EXIT=$code" | tee -a .verification.txt
          echo '=== targeted direct-runtime tests ===' | tee -a .verification.txt
          pnpm --filter @runtime-inspector/react-native exec vitest run src/protocol-client.test.ts 2>&1 | tee -a .verification.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then status=$code; fi
          echo "DIRECT_RUNTIME_TEST_EXIT=$code" | tee -a .verification.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .verification.txt
          git commit -m "Capture verification output [skip ci]"
          git push
          exit "$status"
