name: Verify branch

on:
  push:
    branches:
      - rozenite-client

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify and capture output
        shell: bash
        run: |
          set +e
          status=0
          : > .verification.txt
          for command in build typecheck test; do
            echo "=== pnpm $command ===" | tee -a .verification.txt
            pnpm "$command" 2>&1 | tee -a .verification.txt
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then status=$code; fi
            echo "${command^^}_EXIT=$code" | tee -a .verification.txt
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .verification.txt
          git commit -m "Capture verification output [skip ci]"
          git push
          exit "$status"
